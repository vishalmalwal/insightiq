name: insightiq

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insightiq
      POSTGRES_PASSWORD: insightiq
      POSTGRES_DB: insightiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+psycopg://insightiq:insightiq@db:5432/insightiq
      STORAGE_BACKEND: local
      DUCKDB_DIR: /data/duckdb
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      APP_SHARED_SECRET: ${APP_SHARED_SECRET:-}
      CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - duckdata:/data/duckdb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  duckdata:
