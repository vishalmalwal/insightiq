name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insightiq
          POSTGRES_PASSWORD: insightiq
          POSTGRES_DB: insightiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insightiq"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy app
      - name: Migrations up/down (real Postgres)
        env:
          DATABASE_URL: postgresql+psycopg://insightiq:insightiq@localhost:5432/insightiq
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: Test
        run: pytest -q
      - name: Eval suite (SQL-accuracy gate)
        env:
          DATABASE_URL: postgresql+psycopg://insightiq:insightiq@localhost:5432/insightiq
          LLM_PROVIDER: mock
          STORAGE_BACKEND: local
          DUCKDB_DIR: /tmp/duckdb
        run: insightiq eval --ci --threshold 0.75

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
